<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>高危名单 — SigmaMentor 教师端</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,800;1,500&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Serif+SC:wght@500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/app.css">
<style>
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}

  .risk-list{display:flex;flex-direction:column;gap:12px}
  .risk-item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;transition:border-color .2s}
  .risk-item.open{border-color:var(--line-strong)}
  .risk-item.followed{opacity:.72}
  .risk-head{display:grid;grid-template-columns:44px minmax(0,1.1fr) minmax(0,2fr) auto;gap:14px;align-items:center;padding:14px 18px;cursor:pointer}
  .risk-head:hover{background:rgba(10,10,11,.03)}
  .risk-head .r-no{font-family:var(--serif-en);font-style:italic;font-size:21px;color:var(--fg-faint)}
  .risk-head .r-who b{font-size:15px;font-weight:600;display:block}
  .risk-head .r-who span{font-family:var(--mono);font-size:10.5px;color:var(--fg-muted);letter-spacing:.06em}
  .risk-head .r-sum{font-size:12.5px;color:var(--fg-muted);line-height:1.6}
  .risk-head .r-badges{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  .risk-head .chev{font-family:var(--mono);font-size:11px;color:var(--fg-faint);transition:transform .2s;white-space:nowrap}
  .risk-item.open .chev{transform:rotate(180deg)}

  .risk-body{border-top:1px solid var(--line);padding:18px;display:none}
  .risk-item.open .risk-body{display:block}

  .ev-grid{display:grid;grid-template-columns:7fr 5fr;gap:20px}
  .ev-k{font-family:var(--mono);font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--fg-faint);margin-bottom:10px}
  .same-chips{display:flex;flex-direction:column;gap:7px}
  .same-chips .sc{font-size:12.5px;color:var(--fg-muted);border-left:2px solid var(--line-mid);padding-left:10px;line-height:1.6}
  .ev-detail{font-size:12.5px;color:var(--fg-muted);line-height:1.75;border-top:1px dashed var(--line);margin-top:14px;padding-top:12px}

  .advice{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
  .follow-row{display:flex;align-items:center;gap:10px;margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
  .follow-chk{display:inline-flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;user-select:none}
  .follow-chk input{width:16px;height:16px;accent-color:#0a0a0b;cursor:pointer}

  .risk-banner{margin-top:18px}
  .tsep{font-family:var(--mono);opacity:.35;align-self:center}

  @media (max-width:759px){
    .risk-head{grid-template-columns:36px 1fr auto}
    .risk-head .r-sum{grid-column:2 / -1}
    .risk-head .r-badges{grid-column:2 / -1;justify-content:flex-start}
    .ev-grid{grid-template-columns:1fr}
  }
</style>
</head>
<body class="theme-gray">
<div class="app">
  <div id="nav-mount"></div>

  <main class="main">
    <div class="page-head" data-od-id="page-head">
      <div>
        <div class="kicker">F7 · 高危名单 / At-Risk Students</div>
        <h1 class="h-page">高危名单 · <span id="head-count">6</span> / 52 人</h1>
        <div class="page-meta">
          <span>规则 · 连续同型卡点 ≥ 3</span><span>放弃 ≥ 2</span><span>提交轨迹异常</span>
          <span>对照人工标注召回率 92%（演示）</span>
        </div>
      </div>
      <div class="head-actions">
        <a class="btn btn-ghost btn-sm" href="dashboard.html">返回看板</a>
      </div>
    </div>

    <div class="page-body">
      <div class="filters" id="filters" data-od-id="risk-filters"></div>
      <div class="risk-list" id="list" data-od-id="risk-list"></div>

      <div class="banner risk-banner" data-od-id="risk-redline">
        <span class="tag">红线</span>
        <span>名单与证据仅教师可见，<span style="text-decoration:underline;text-underline-offset:5px">不通知学生、不自动定罪</span> · 学生可申诉 · 教师可随时接管任何对话</span>
      </div>
    </div>
  </main>
</div>

<script src="../assets/app.js"></script>
<script src="../assets/data.js"></script>
<script>
SM.shell("teacher", "students");
(function () {
  "use strict";
  var D = window.SM_DATA;
  var filter = "all";

  /* ============ 过滤器 ============ */
  function counts() {
    var c = { all: D.risk.length, continuous: 0, drop: 0, anomaly: 0 };
    D.risk.forEach(function (r) {
      r.rules.forEach(function (k) { c[k] += 1; });
    });
    return c;
  }
  function renderFilters() {
    var c = counts();
    var defs = [
      { k: "all", label: "全部" },
      { k: "continuous", label: "连续卡点" },
      { k: "drop", label: "多次放弃" },
      { k: "anomaly", label: "轨迹异常" },
    ];
    var host = document.getElementById("filters");
    host.innerHTML = "";
    defs.forEach(function (d) {
      var b = document.createElement("button");
      b.className = "chip" + (filter === d.k ? " on" : "");
      b.textContent = d.label + " · " + c[d.k];
      b.addEventListener("click", function () {
        filter = d.k;
        renderFilters();
        renderList();
      });
      host.appendChild(b);
    });
  }

  /* ============ 名单 ============ */
  function ruleBadges(rules) {
    return rules.map(function (k) {
      var r = D.RULES[k];
      return '<span class="badge ' + r.cls + '">' + r.label + "</span>";
    }).join("");
  }
  function renderList() {
    var host = document.getElementById("list");
    var items = D.risk.filter(function (r) {
      return filter === "all" || r.rules.indexOf(filter) >= 0;
    });
    document.getElementById("head-count").textContent = items.length;

    host.innerHTML = "";
    items.forEach(function (r, i) {
      var followed = SM.store("sm-follow-" + r.id) === "1";
      var isOpen = i === 0 && filter === "all";
      var el = document.createElement("div");
      el.className = "risk-item" + (followed ? " followed" : "") + (isOpen ? " open" : "");
      el.setAttribute("data-od-id", "risk-" + r.name);

      var track = r.track.map(function (t) {
        return '<span class="tnode e-' + t.type + '"><b>' + t.label + "</b>" + t.t + "</span>";
      }).join('<span class="tsep">›</span>');

      var same = r.same.map(function (s) {
        return '<div class="sc">' + s + "</div>";
      }).join("");

      var advice = r.advice.map(function (a, j) {
        return '<button class="btn btn-ghost btn-sm" data-advice="' + a + '">' + a + "</button>";
      }).join("");

      el.innerHTML =
        '<div class="risk-head" role="button" tabindex="0" aria-expanded="' + isOpen + '">' +
        '<span class="r-no">' + ("0" + (i + 1)).slice(-2) + "</span>" +
        '<span class="r-who"><b>' + r.name + "</b><span>" + r.id + "</span></span>" +
        '<span class="r-sum">' + r.summary + "</span>" +
        '<span class="r-badges">' + ruleBadges(r.rules) +
        (followed ? '<span class="badge b-outline">✓ 已跟进</span>' : "") +
        '<span class="chev">' + (isOpen ? "收起 ∧" : "展开 ∨") + '</span></span>' +
        "</div>" +
        '<div class="risk-body">' +
        '<div class="ev-grid">' +
        "<div>" +
        '<div class="ev-k">提交轨迹 · submission_events</div>' +
        '<div class="track">' + track + "</div>" +
        '<div class="ev-detail">' + r.detail + "</div>" +
        "</div>" +
        "<div>" +
        '<div class="ev-k">同型 / 异常序列</div>' +
        '<div class="same-chips">' + same + "</div>" +
        '<div class="ev-k" style="margin-top:16px">建议干预（辅助决策 · 教师确认后执行）</div>' +
        '<div class="advice">' + advice + "</div>" +
        "</div>" +
        "</div>" +
        '<div class="follow-row">' +
        '<label class="follow-chk"><input type="checkbox" ' + (followed ? "checked" : "") + '> 已跟进（本周内联系 / 处理）</label>' +
        '<span class="note">勾选状态保存在本地 · 仅为演示</span>' +
        "</div>" +
        "</div>";

      /* 展开 / 收起 */
      var head = el.querySelector(".risk-head");
      function toggle() {
        el.classList.toggle("open");
        head.setAttribute("aria-expanded", el.classList.contains("open"));
        head.querySelector(".chev").textContent = el.classList.contains("open") ? "收起 ∧" : "展开 ∨";
      }
      head.addEventListener("click", function (e) {
        if (e.target.closest(".follow-chk")) return;
        toggle();
      });
      head.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); }
      });

      /* 跟进状态 */
      var chk = el.querySelector(".follow-chk input");
      chk.addEventListener("change", function () {
        SM.store("sm-follow-" + r.id, chk.checked ? "1" : "0");
        el.classList.toggle("followed", chk.checked);
      });

      /* 干预建议 → 待办（演示） */
      el.querySelectorAll("[data-advice]").forEach(function (b) {
        b.addEventListener("click", function () {
          SM.toast({
            kicker: "Intervention Queue · 干预待办",
            title: "已加入待办：" + b.getAttribute("data-advice"),
            body: "对象：" + r.name + "（" + r.id + "）· 执行前需教师确认（红线 ③）。",
            duration: 5000,
          });
        });
      });

      host.appendChild(el);
    });
  }

  renderFilters();
  renderList();
})();
</script>
</body>
</html>
